name: Publicar Jornal do Matha

on:
  workflow_dispatch:
    inputs:
      texto:
        description: 'Texto do Jornal do Matha'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Abrir a redação
        uses: actions/checkout@v4

      - name: Montar edição
        env:
          TEXTO: ${{ inputs.texto }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid
          from datetime import datetime, timezone

          texto = os.environ["TEXTO"]

          agora = datetime.now(timezone.utc)

          briefing = [{
              "uid": f"jornal-do-matha-{uuid.uuid4()}",
              "updateDate": agora.isoformat(timespec="seconds").replace("+00:00", "Z"),
              "titleText": "Jornal do Matha",
              "mainText": texto,
              "redirectionUrl": "https://mathaeuscomercial-netizen.github.io/jornal-do-matha/"
          }]

          with open("briefing.json", "w", encoding="utf-8") as arquivo:
              json.dump(briefing, arquivo, ensure_ascii=False)

          print("Edição montada com sucesso.")
          PY

      - name: Publicar edição
        run: |
          git config user.name "Redação do Jornal do Matha"
          git config user.email "actions@github.com"
          git add briefing.json
          git commit -m "Publicar nova edição do Jornal do Matha" || exit 0
          git push
